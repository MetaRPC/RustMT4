[package]
name = "metarpc-mt4"
version = "0.2.0"
edition = "2021"
authors = ["MetaRPC <info@metarpc.pro>"]
description = "Asynchronous, memory-safe Rust SDK for MetaTrader 4 algorithmic trading automation (MetaRPC gRPC gateway)"
license = "MIT"
repository = "https://github.com/MetaRPC/RustMT4"
autoexamples = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
# gRPC transport. The generated code in package/mt4_term_api.rs targets tonic 0.12 / prost 0.13
# (tonic::body::BoxBody, GrpcMethod, max_decoding_message_size). Do not bump to tonic 0.13+
# without regenerating package/*.rs.
tonic = { version = "0.12", features = ["transport", "tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }

[[example]]
name = "menu"
path = "examples/menu.rs"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "lowlevel_general"
path = "examples/1_lowlevel/general_operations.rs"

[[example]]
name = "lowlevel_trading"
path = "examples/1_lowlevel/trading.rs"

[[example]]
name = "lowlevel_streaming"
path = "examples/1_lowlevel/streaming.rs"

[[example]]
name = "service_demo"
path = "examples/2_service/service_demo.rs"

[[example]]
name = "sugar_basics"
path = "examples/3_sugar/basics.rs"

[[example]]
name = "sugar_trading"
path = "examples/3_sugar/trading.rs"

[[example]]
name = "sugar_positions"
path = "examples/3_sugar/positions.rs"

[[example]]
name = "strategies_demo"
path = "examples/4_strategies/strategies_demo.rs"
